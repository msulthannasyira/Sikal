<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masukkan Kode Undangan - Bergabung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

<!-- Video background -->
<video class="login-bg-video" id="bgVideo" autoplay muted loop playsinline>
  <source src="{{ url_for('static', filename='video/login.mp4') }}" type="video/mp4">
</video>
<!-- Black overlay -->
<div class="login-bg-overlay"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <i class="bi bi-leaf-fill text-success fs-1"></i>
      <h3 class="mt-2 fw-bold">Bergabung</h3>
      <p class="text-muted small">Masukkan Kode Undangan Admin</p>
    </div>

    <form method="POST" action="{{ url_for('join') }}">
      <div class="mb-4">
        <label class="form-label fw-semibold">Kode Undangan <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
          <input type="text" name="invite_code" class="form-control text-center fw-bold"
                 placeholder="Paste kode di sini" required autofocus
                 autocomplete="off" style="letter-spacing:.1em">
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Bergabung
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('logout') }}" class="text-muted small">
        <i class="bi bi-box-arrow-left me-1"></i>Keluar
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Mulai video dari detik acak agar tidak selalu mulai dari awal
  const vid = document.getElementById('bgVideo');
  vid.addEventListener('loadedmetadata', function () {
    vid.currentTime = Math.random() * vid.duration;
  });
</script>
{% include '_flash_toast.html' %}
</body>
</html>
