<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SiKal</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_white.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-card .form-label   { font-size: 16px; }
    .login-card .text-muted,
    .login-card a.small,
    .login-card .alert        { font-size: 14px; }
  </style>
</head>
<body class="login-page">

<!-- Video background -->
<video class="login-bg-video" autoplay muted loop playsinline>
  <source src="{{ url_for('static', filename='video/login.mp4') }}" type="video/mp4">
</video>
<!-- Green gradient overlay 50% -->
<div class="login-bg-overlay"></div>

<div class="login-wrapper">
  <!-- Brand di luar card -->
  <div class="login-brand-outer">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo SIKAL" class="login-logo">
    <h2 class="login-title">Login <span>SIKAL</span></h2>
  </div>

  <div class="login-card">

    <form method="POST" action="{{ url_for('login_no_captcha') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Masukkan username"
                 required autofocus autocomplete="username" {% if locked %}disabled{% endif %}>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" id="passwordInput" class="form-control"
                 placeholder="Masukkan password" required autocomplete="current-password"
                 {% if locked %}disabled{% endif %}>
          <button class="btn btn-outline-secondary" type="button" id="togglePw" {% if locked %}disabled{% endif %}>
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 fw-semibold" {% if locked %}disabled{% endif %}>
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted small">Belum punya akun?</span>
      <a href="{{ url_for('register_no_captcha') }}" class="small ms-1">Daftar sekarang</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('togglePw').addEventListener('click', function () {
    const inp = document.getElementById('passwordInput');
    const icon = this.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });
</script>
{% include '_flash_toast.html' %}
</body>
</html>
